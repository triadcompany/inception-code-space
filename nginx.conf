server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded files — served from the shared volume mounted at
    # <root>/uploads. `^~` wins over the static-asset regex below.
    # Uses the server `root` (not `alias`) — `alias` + `try_files` is buggy.
    location ^~ /uploads/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API — reverse-proxied to the api service.
    # Compose usa `api`; no EasyPanel o alias é <projeto>_<serviço>.
    # Ajuste este host se o nome do projeto/serviço mudar.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream "sitetriadcompany_site-ofilhodohomem-api:8080";
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
